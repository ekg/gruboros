name: gruboros
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Core requirements
  - python=3.11
  - pytorch>=2.1.0
  - pytorch-cuda=12.1
  - numpy
  
  # Essential packages
  - psutil
  - tqdm
  
  # Distributed training
  - deepspeed
  
  # Build tools
  - pip
  - git
  
  # Pip packages
  - pip:
    - accelerate
    - git+https://github.com/facebookresearch/schedule_free.git